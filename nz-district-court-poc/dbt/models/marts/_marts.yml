version: 2

models:
  - name: fct_dc_decisions
    description: >
      One row per included District Court decision. case_name carries the
      OPS.MASK_PARTY_NAME masking policy (applied by a post-hook).
    columns:
      - name: relative_path
        tests: [unique, not_null]
      - name: case_type
        tests:
          - accepted_values:
              values: ['criminal', 'civil', 'unknown']
      - name: reform_period
        tests:
          - accepted_values:
              values: ['before reform', 'after reform', 'unknown']
      - name: judgment_date
        tests:
          - dbt_utils.expression_is_true:
              expression: "<= current_date()"
              config: {where: "judgment_date is not null"}
      - name: neutral_citation
        tests:
          - unique:
              config: {where: "neutral_citation is not null", severity: warn}
          - dbt_utils.expression_is_true:
              expression: "like '%NZDC%'"
              config: {where: "neutral_citation is not null", severity: warn}
      - name: end_sentence_months
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 120
              where: "end_sentence_months is not null"
              config: {severity: warn}
  - name: fct_sentencing_adjustments
  - name: agg_sentencing_reform
  - name: agg_registry_activity
  - name: bridge_dc_statutes
  - name: bridge_dc_charges
