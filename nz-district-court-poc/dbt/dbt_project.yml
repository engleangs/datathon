name: nz_district_court
version: "0.1.0"
config-version: 2
profile: nz_district_court

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Anything below this confidence from Bedrock is flagged for human review.
  min_bedrock_confidence: 0.6
  # Sentencing (Reform) Amendment Act 2025 in force. Splits "before" and "after".
  sentencing_reform_date: "2025-06-29"
  # Cap on personal mitigation discounts after the reform (percent).
  personal_mitigation_cap_pct: 40

models:
  nz_district_court:
    +query_tag: "nzdc:dbt"
    staging:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table
    eval:
      +schema: MARTS
      +materialized: view

seeds:
  nz_district_court:
    +schema: STAGING
    gold_labels:
      +column_types:
        judgment_date: date
        end_sentence_months: float
