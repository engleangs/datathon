version: 2

models:
  - name: int_latest_extractions
    description: The most recent extraction for each source document.

    columns:
      - name: document_id
        data_tests:
          - unique
          - not_null

  - name: int_judgment_judges
    description: Judges split out of the single judge string, with titles stripped.

  - name: int_judgment_topics
    description: Legal topics flattened from each judgment.

  - name: int_judgment_legislation
    description: Legislation references flattened from each judgment.

  - name: int_judgment_cases_cited
    description: Case citations flattened from each judgment.
